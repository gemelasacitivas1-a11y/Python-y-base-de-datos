<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body>
    <h1>{{title}}</h1>

    {% if pacientes %}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>apellido</th>
                    <th>Cedula</th>
                </tr>
            </thead>
        <tbody>
            {% for pacientes in pacientes %}
            <tr>
                <td>{{pacientes[0]}}</td>
                <td>{{pacientes[1]}}</td>
                <td>{{pacientes[2]}}</td>
                <td>{{pacientes[3]}}</td>
                {%endfor%}
            </tr>
        </tbody>
    </table>
    {% else %}
    <p>no se encontraron registros o hubo un error de conexion.</p>
    {% endif %}
</body>
</html>
